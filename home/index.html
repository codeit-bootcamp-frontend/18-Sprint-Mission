<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link rel="stylesheet" href="https://noonnu.cc/font_page/849" />
    <link rel="stylesheet" href="https://noonnu.cc/font_page/694" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:image" content="/img/og_image.png" />
    <meta property="og:url" content="https://pandamarket.com/" />
  </head>
  <body>
    <header class="header">
      <div class="title">
        <a href="index.html" class="logo">
          <img
            src="../assets/img/ic_logo.svg"
            alt="판다 로고"
            width="40"
            height="40"
            loading="lazy"
          />
          <span class="brand-name">판다마켓</span>
        </a>
      </div>
      <a class="login" href="/login/login.html">로그인</a>
    </header>
    <main>
      <div class="main">
        <div class="main-content">
          <h1 class="main-title">일상의 모든 물건을<br />거래해 보세요</h1>
          <a class="main-btn" href="/items">구경하러가기</a>
        </div>
        <img
          class="main-home-top"
          src="../assets/img/Img_home_top.png"
          alt="Img_home_top"
          loading="lazy"
        />
      </div>
    </main>

    <section class="content">
      <img
        src="../assets/img/Img_home_01.png"
        alt="인기 상품 이미지"
        loading="lazy"
      />
      <div class="content-box">
        <span class="content-name">Hot item</span>
        <p class="content-title">인기 상품을<br />확인해 보세요</p>
        <p class="content-Subheading">
          가장 Hot한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
        </p>
      </div>
    </section>
    <section class="content-2">
      <div class="content-box">
        <span class="content-name">Search</span>
        <p class="content-title">구매를 원하는<br />상품을 검색하세요</p>
        <p class="content-Subheading">
          구매하고싶은 물품은 검색해서<br />쉽게 찾아보세요
        </p>
      </div>
      <img
        src="../assets/img/Img_home_02.png"
        alt="구매 상품 이미지"
        loading="lazy"
      />
    </section>
    <section class="content">
      <img
        src="../assets/img/Img_home_03.png"
        alt="판매 상품 이미지"
        loading="lazy"
      />
      <div class="content-box">
        <span class="content-name">Register</span>
        <p class="content-title">판매를 원하는<br />상품을 등록하세요</p>
        <p class="content-Subheading">
          어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
        </p>
      </div>
    </section>
    <section class="bottom">
      <div class="bottom-main">
        <div class="main-content">
          <p class="main-title">믿을 수 있는<br />판다마켓 중고 거래</p>
        </div>
        <img
          class="main-home-top"
          src="../assets/img/Img_home_bottom.png"
          alt="home_bottom"
          loading="lazy"
        />
      </div>
    </section>

    <footer class="footer">
      <div class="footer-left">
        <p>@codeit - 2024</p>
      </div>

      <div class="footer-center">
        <a href="/privacy">Privacy Policy</a>
        <a href="/faq">FAQ</a>
      </div>

      <ul class="footer-right">
        <li>
          <a href="https://www.facebook.com/">
            <img
              src="../assets/img/ic_facebook.svg"
              alt="Facebook 아이콘"
              loading="lazy"
            />
          </a>
        </li>
        <li>
          <a href="https://x.com/">
            <img
              src="../assets/img/ic_twitter.svg"
              alt="Twitter 아이콘"
              loading="lazy"
            />
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com/">
            <img
              src="../assets/img/ic_youtube.svg"
              alt="YouTube 아이콘"
              loading="lazy"
            />
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/">
            <img
              src="../assets/img/ic_instagram.svg"
              alt="Instagram 아이콘"
              loading="lazy"
            />
          </a>
        </li>
      </ul>
    </footer>
  </body>
</html>
