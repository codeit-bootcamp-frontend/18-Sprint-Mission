<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>
    <header>
        <a href="/" id="logo"><img src="img/logo_big.png" class="img">판다마켓</a>
    </header>
    <main>
        <label for="email" class="labels">이메일</label>
        <input id="email" type="email" name="useremail" class="inputbox">      
        <label for="password" class="labels" >비밀번호</label>
        <div class="passwordbox">
            <input id="password" type="password" name="password" class="inputbox">
            <span class="blindIco"><img src="/img/password_on.svg" alt="blinder"></span>
        </div>
        <button type="submit">로그인</button>
        <div class="simple">
            <span>간편 로그인하기</span>
            <span>
                <a href="https://www.google.com/"><img src="img/ic_google.svg" alt="googleLogin"></a>
                <a href="https://www.kakaocorp.com/page/"><img src="img/ic_kakao.svg" alt="kakaoLogin"></a>
            </span>
        </div>
        <div class="signup">
            판다마켓이 처음이신가요?<a href="/signup.html">회원가입</a>
        </div>
    </main>
</body>
</html>
