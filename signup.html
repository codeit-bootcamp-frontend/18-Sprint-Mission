<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="icon" href="images/favicon-panda.png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/signup.css" />
    <script src="js/signup.js"></script>
  </head>

  <body>
    <main class="login-wrapper">
      <form class="login-box" autocomplete="off" id="signupForm">
        <div class="logo-row">
          <a href="/">
            <img src="images/logo.png" alt="판다로고" class="logo-img" />
          </a>
        </div>
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" required />
          <div class="error-message" id="email-error"></div>
        </div>
        <div class="form-group">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" required />
          <div class="error-message" id="nickname-error"></div>
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="password">
            <input type="password" id="password" required />
            <button
              type="button"
              class="btn"
              onclick="inputPassword('password', 'eye-icon')"
            >
              <img
                src="images/eye-off.png"
                alt="비밀번호 숨기기"
                id="eye-icon"
                class="eye-icon"
              />
            </button>
          </div>
          <div class="error-message" id="password-error"></div>
        </div>
        <div class="form-group">
          <label for="password-confirm">비밀번호 확인</label>
          <div class="password">
            <input type="password" id="password-confirm" required />
            <button
              type="button"
              class="btn"
              onclick="confirmPassword('password-confirm', 'eye-icon2')"
            >
              <img
                src="images/eye-off.png"
                alt="비밀번호 숨기기"
                id="eye-icon2"
                class="eye-icon"
              />
            </button>
          </div>
          <div class="error-message" id="password-confirm-error"></div>
        </div>
        <button type="submit" class="login-btn" id="signupBtn" disabled>
          회원가입
        </button>
        <div class="social-login">
          <p class="social-login-text">간편 로그인하기</p>
          <div class="social-icons">
            <a href="https://www.google.com/" class="social">
              <img src="images/google.png" alt="간편 로그인-구글" />
            </a>
            <a href="https://www.kakaocorp.com/page/" class="social">
              <img src="images/kakao.png" alt="간편 로그인-카카오" />
            </a>
          </div>
        </div>
        <p class="signup-callout">
          이미 회원이신가요? <a href="/login">로그인</a>
        </p>
      </form>
    </main>
  </body>
</html>
