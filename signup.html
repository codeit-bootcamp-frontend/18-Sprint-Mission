<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="logo">
      <a href="/">
        <img src="Images/logo-panda.png" alt="판다마켓 랜딩페이지로 이동" />
      </a>
    </div>
    <main class="login-content">
      <form id="signup_form" action="">
        <div class="email">
          <label for="signup_email" class="login-label">이메일</label>
          <input id="signup_email" name="signup_email" type="email" class="login-input f-regular" required autofocus/>
        </div>
        <div class="name">
          <label for="signup_name" class="login-label">닉네임</label>
          <input id="signup_name" name="signup_name" class="login-input f-regular" required/>
        </div>
        <div class="password">
          <label for="signup_password" class="login-label">비밀번호</label>
          <input id="signup_password" name="signup_password" type="password" minlength="8" class="login-input f-regular letter-sp-04" required/>
          <button type="button" class="btn-show"></button>
        </div>
        <div class="password-check">
          <label for="signup_password_check" class="login-label">비밀번호 확인</label>
          <input id="signup_password_check" name="signup_password_check" type="password" class="login-input f-regular letter-sp-04" required/>
          <button type="button" class="btn-show"></button>
        </div>
        <button class="large inactive">회원가입</button>
      </form>
      <div class="login-social">
        간편 로그인하기
        <ul>
          <li class="google">
            <a href="https://www.google.com/"><img src="Images/ic_google.svg" alt="구글 계정으로 간편 로그인"></a>
          </li>
          <li class="kakao">
            <a href="https://kakaocorp.com/page/"><img src="Images/ic_kakao.svg" alt="카카오 계정으로 간편 로그인"></a>
          </li>
        </ul>
      </div>
      <div class="login-help">
        이미 회원이신가요?
        <a href="/login.html ">로그인</a>
      </div>
    </main>
    <script src="validation.js"></script>
  </body>
</html>
