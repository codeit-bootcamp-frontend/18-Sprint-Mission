<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>

    <link rel="icon" href="images/logo/favicon.ico" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/signup.css" />
  </head>
  <body>
    <div id="signupWrapper">
      <!-- header 시작 -->
      <header>
        <a href="/"
          ><img src="../images/login&signup/logo/logo.svg" alt="판다마켓 로고"
        /></a>
        <h1>판다마켓</h1>
      </header>
      <!-- main 시작 -->
      <main>
        <form action="#" id="signupInputForm">
          <label for="signupEmail">이메일</label>
          <input
            name="userEmail"
            id="signupEmail"
            type="email"
            placeholder="codeit@email.com"
            autofocus
            required
          />

          <span id="emailEmptyErr" class="error-message"
            >이메일을 입력해주세요.</span
          >
          <span id="emailInvalidErr" class="error-message"
            >잘못된 이메일 형식입니다.</span
          >

          <label for="signupNickname">닉네임</label>
          <input
            name="userNickname"
            id="signupNickname"
            type="text"
            placeholder="판다"
            required
          />
          <span id="nicknameEmptyErr" class="error-message"
            >닉네임을 입력해주세요.</span
          >

          <div class="signupPasswordWrap">
            <label for="signupPassword">비밀번호</label>
            <input
              name="userPassword"
              id="signupPassword"
              class="signupPasswordClass"
              type="password"
              placeholder="......"
              required
            />
            <button class="passwordEye">
              <img src="../images/login&signup/password-eye.png" />
            </button>
          </div>

          <span id="passwordEmptyErr" class="error-message"
            >비밀번호를 입력해주세요.</span
          >
          <span id="passwordInvalidErr" class="error-message"
            >비밀번호를 8자 이상 입력해주세요.</span
          >

          <div class="signupPasswordWrap">
            <label for="signupPasswordCheck">비밀번호 확인</label>
            <input
              name="userPasswordCheck"
              id="signupPasswordCheck"
              class="signupPasswordClass"
              type="password"
              placeholder="......"
              required
            />
            <button class="passwordEye">
              <img src="../images/login&signup/password-eye.png" />
            </button>
          </div>

          <span id="passwordConfirmErr" class="error-message"
            >비밀번호가 일치하지 않습니다.</span
          >

          <button id="signupButton" type="submit">회원가입</button>
        </form>
        <div id="signupBySns">
          <span>간편 로그인하기</span>
          <div id="snsLogo">
            <a href="https://www.google.com/" target="_blank"
              ><img
                src="../images/login&signup/sns/google-logo.svg"
                alt="구글 로고"
            /></a>
            <a href="https://www.kakaocorp.com/page/" target="_blank"
              ><img
                src="../images/login&signup/sns/kakao-logo.svg"
                alt="카카오 로고"
            /></a>
          </div>
        </div>
        <span id="foot"
          >이미 회원이신가요?<a id="signup" href="../login/">로그인</a></span
        >
      </main>
    </div>
    <script src="../javascript/signup.js"></script>
  </body>
</html>
